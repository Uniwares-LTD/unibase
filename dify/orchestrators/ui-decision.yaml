          "id": "generate-source-end",
          "source": "generate",
          "target": "end",
          "sourceHandle": "source",
          "targetHandle": "target",
          "type": "custom",
          "data": {
            "sourceType": "code",
            "targetType": "code",
            "isInIteration": false,
            "isInLoop": false
          }
        }
      ],
      "viewport": {
        "x": 0,
        "y": 0,
        "zoom": 0.7
      }
    }
