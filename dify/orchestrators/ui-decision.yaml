        {
          "id": "decision",
          "type": "custom",
          "data": {
            "type": "human-input",
            "title": "Choose a direction",
            "desc": "",
            "selected": false,
            "form_content": "```unibase-ui\n{\"version\": 1, \"cards\": [{\"id\": \"direction\", \"content\": {\"type\": \"question\", \"version\": 1, \"data\": {\"kind\": \"single\", \"title\": \"Choose a direction\", \"explanation\": \"Your selection continues this run.\", \"options\": [{\"id\": \"brief\", \"label\": \"Brief\"}, {\"id\": \"detailed\", \"label\": \"Detailed\"}]}}}]}\n```\n{{#$output.response#}}",
            "inputs": [
              {
                "type": "paragraph",
                "output_variable_name": "response",
                "default": {
                  "type": "constant",
                  "selector": [],
                  "value": ""
                }
              }
            ],
            "user_actions": [
              {
                "id": "continue",
                "title": "Continue",
                "button_style": "primary"
              }
