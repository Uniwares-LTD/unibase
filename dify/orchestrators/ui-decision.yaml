              {
                "id": "00000000-0000-4000-8000-000000000010",
                "type": "webapp",
                "enabled": true,
                "config": {}
              }
            ],
            "timeout": 24,
            "timeout_unit": "hour"
          },
          "position": {
            "x": 320,
            "y": 100
          },
          "sourcePosition": "right",
          "targetPosition": "left",
          "width": 244,
          "height": 100
        },
        {
          "id": "generate",
          "type": "custom",
          "data": {
            "type": "code",
            "title": "Generate structured result",
            "desc": "",
            "selected": false,
            "code_language": "python3",
            "code": "import json\ndef main(prompt: str, response: str = \"\") -> dict:\n    result = {\"version\":1,\"outcome\":\"success\",\"text\":prompt + \" | \" + response,\"cards\":[],\"images\":[],\"failure\":None,\"checkpoint\":None}\n    return {\"result\": json.dumps(result)}\n",
            "variables": [
              {
                "variable": "prompt",
                "value_selector": [
                  "start",
                  "prompt"
                ]
              },
              {
                "variable": "response",
                "value_selector": [
                  "decision",
                  "response"
                ]
              }
            ],
            "outputs": {
              "result": {
                "type": "string",
                "children": null
              }
            }
          },
          "position": {
            "x": 600,
            "y": 100
          },
          "sourcePosition": "right",
          "targetPosition": "left",
          "width": 244,
          "height": 100
        },
        {
          "id": "end",
          "type": "custom",
          "data": {
            "type": "end",
            "title": "Result",
            "desc": "",
            "selected": false,
            "outputs": [
              {
                "variable": "result",
                "value_selector": [
                  "generate",
                  "result"
                ]
              }
            ]
          },
          "position": {
            "x": 900,
            "y": 100
          },
          "sourcePosition": "right",
          "targetPosition": "left",
          "width": 244,
          "height": 100
        }
      ],
      "edges": [
        {
          "id": "start-source-decision",
          "source": "start",
          "target": "decision",
          "sourceHandle": "source",
          "targetHandle": "target",
