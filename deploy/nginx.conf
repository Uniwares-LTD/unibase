worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  access_log off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  # Only the host connector entering through the bridge gateway is trusted.
  set_real_ip_from INGRESS_GATEWAY;
  real_ip_header CF-Connecting-IP;
  real_ip_recursive off;
  limit_req_zone $binary_remote_addr zone=ingress:10m rate=10r/s;
  server {
    listen 8080;
    listen 3000;
    client_max_body_size 21m;
    client_body_timeout 30s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    location = /api/health/live { proxy_pass http://application-backend:3000; }
    location / {
      limit_req zone=ingress burst=30 nodelay;
      limit_req_status 429;
      proxy_pass http://application-backend:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header CF-Connecting-IP "";
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_read_timeout 180s;
      proxy_send_timeout 30s;
    }
  }
}
