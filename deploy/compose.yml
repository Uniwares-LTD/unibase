name: ${PROJECT_SLUG:-unibase}-${DEPLOY_ENV:?required}
services:
  app:
    image: ${IMAGE_DIGEST:?required}
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    env_file:
      - path: ./runtime.env
        format: raw
    environment:
      RELEASE_COMMIT: ${RELEASE_COMMIT:?required}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase.json
    volumes:
      - ./firebase.json:/run/secrets/firebase.json:ro
    tmpfs:
      - /tmp:uid=1001,gid=1001,mode=1777
      - /app/.next/cache:uid=1001,gid=1001,mode=0700
    networks:
      application:
        aliases: [application-backend]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
    mem_limit: 1g
    cpus: 1
  worker:
    networks: [application]
    image: ${IMAGE_DIGEST:?required}
    command: [node, payment-worker.cjs]
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    env_file:
      - path: ./runtime.env
        format: raw
    environment:
      RELEASE_COMMIT: ${RELEASE_COMMIT:?required}
    healthcheck:
      test: [CMD, node, worker-healthcheck.cjs, payment]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    tmpfs:
      - /tmp:uid=1001,gid=1001,mode=1777
    mem_limit: 256m
    cpus: 0.5
  ai-worker:
    networks: [application]
    image: ${IMAGE_DIGEST:?required}
    command: [node, ai-worker.cjs]
    init: true
    restart: unless-stopped
    stop_grace_period: 180s
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    env_file:
      - path: ./runtime.env
        format: raw
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase.json
      RELEASE_COMMIT: ${RELEASE_COMMIT:?required}
    healthcheck:
      test: [CMD, node, worker-healthcheck.cjs, ai]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    volumes:
      - ./firebase.json:/run/secrets/firebase.json:ro
    tmpfs:
      - /tmp:uid=1001,gid=1001,mode=1777
    mem_limit: 512m
    cpus: 0.5
  redis:
    image: ${REDIS_IMAGE:?required}
    user: "1001:1001"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: [sh, -c, 'exec redis-server --save "" --appendonly no --requirepass "$$(cat /run/secrets/redis-password)"']
    volumes:
      - ./redis-password:/run/secrets/redis-password:ro
    tmpfs:
      - /data:uid=1001,gid=1001,mode=0700
    networks: [application]
    mem_limit: 128m
  ingress:
    image: ${NGINX_IMAGE:?required}
    user: "101:101"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    tmpfs:
      - /tmp:uid=101,gid=101,mode=0700
      - /var/cache/nginx:uid=101,gid=101,mode=0700
    ports:
      - "127.0.0.1:${APP_PORT:?required}:8080"
    networks:
      application:
    depends_on: [app]
    mem_limit: 128m
networks:
  application:
    ipam:
      config:
        - subnet: ${INGRESS_SUBNET:?required}
